name: CI

# Spec 014 — fast feedback on every PR, not a deploy pipeline. The
# actual iOS compile stays on EAS Build's own cloud (spec 004); this
# workflow never touches a real Firebase project (the integration job
# runs against the local emulator under a fake project id, same as
# running `npm run test:rules` by hand) and needs no secrets.
#
# Three jobs, gated in sequence (`needs:`) rather than run in parallel —
# deliberately: no point spending minutes on unit tests against code
# that doesn't even type-check, or on the emulator-backed integration
# suite if the unit layer (CLAUDE.md's "bulk of the suite, fastest
# feedback") already failed. Costs a little latency on a clean run (the
# stages still run one after another) to save minutes on a broken one,
# and each stage gets its own named status check instead of one combined
# pass/fail.
#
# `push` is limited to main: a PR branch push would otherwise fire both
# events and build every commit twice. Newer pushes to the same ref
# cancel the stale run; the token is read-only; every job has a timeout.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - run: npx tsc --noEmit

  # Runs in parallel with static-analysis; unit waits for both.
  web-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # Catches a broken web bundle before deploy (spec 005). The
      # EXPO_PUBLIC_* values are inlined, never used to connect, so
      # placeholders are enough — no secrets.
      - run: npx expo export -p web --output-dir "$RUNNER_TEMP/web-export"
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-cheap
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
          EXPO_PUBLIC_FIREBASE_APP_ID: ci-placeholder
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ci-placeholder

  unit:
    needs: [static-analysis, web-export]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - run: npm test -- --ci --coverage

      # Always, so a red run still has its report; not on cancel. Spec 014.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  integration:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # firebase-tools requires a JDK (21+) to run the Firestore/Auth
      # emulators — ubuntu-latest has no usable one by default.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Keyed on the Firestore/Auth emulator JARs firebase-tools downloads
      # on first use — without this, every run redownloads them.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - run: npm run test:rules

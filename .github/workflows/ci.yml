name: CI

# Spec 014 — fast feedback on every push, not a deploy pipeline. The
# actual iOS compile stays on EAS Build's own cloud (spec 004); this
# workflow never touches a real Firebase project (the rules job runs
# against the local emulator under a fake project id, same as running
# `npm run test:rules` by hand) and needs no secrets.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test -- --ci

      # Keyed on the Firestore/Auth emulator JARs firebase-tools downloads
      # on first use — without this, every run redownloads them.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - run: npm run test:rules

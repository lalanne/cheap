name: CI

# Spec 014 — fast feedback on every PR, not a deploy pipeline. The
# actual iOS compile stays on EAS Build's own cloud (spec 004); this
# workflow never touches a real Firebase project (the integration job
# runs against the local emulator under a fake project id, same as
# running `npm run test:rules` by hand) and needs no secrets.
#
# Three jobs, gated in sequence (`needs:`) rather than run in parallel —
# deliberately: no point spending minutes on unit tests against code
# that doesn't even type-check, or on the emulator-backed integration
# suite if the unit layer (CLAUDE.md's "bulk of the suite, fastest
# feedback") already failed. Costs a little latency on a clean run (the
# stages still run one after another) to save minutes on a broken one,
# and each stage gets its own named status check instead of one combined
# pass/fail.
#
# `push` is limited to main: a PR branch push would otherwise fire both
# events and build every commit twice. Newer pushes to the same ref
# cancel the stale run; the token is read-only; every job has a timeout.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      # package-lock.json is deliberately pinned to npm 10.9.8 to match
      # EAS Build's builder (see the EAS deploy gotchas) — the runner's
      # default npm (11.x on this Node version) resolves optional
      # platform packages differently and fails `npm ci`'s strict
      # lockfile check. Match the same npm version here instead of
      # keeping two lockfile-compatible versions in sync.
      - run: npm install -g npm@10.9.8

      - run: npm ci

      - run: npx tsc --noEmit

  unit:
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm install -g npm@10.9.8

      - run: npm ci

      - run: npm test -- --ci

  integration:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm install -g npm@10.9.8

      - run: npm ci

      # firebase-tools requires a JDK (21+) to run the Firestore/Auth
      # emulators — ubuntu-latest has no usable one by default.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Keyed on the Firestore/Auth emulator JARs firebase-tools downloads
      # on first use — without this, every run redownloads them.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - run: npm run test:rules
